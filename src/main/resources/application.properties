# Application
spring.application.name=AloMedia

cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Cookie
cookie.secure=${COOKIE_SECURE}

# OAuth2 ? Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# OAuth2 ? GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email

# OAuth2 Frontend Redirect
oauth2.frontend-redirect-url=${OAUTH2_REDIRECT_URL}

# Password Recovery
app.recovery-base-url=${RECOVERY_BASE_URL}

# Email (Resend)
resend.api.key=${RESEND_API_KEY}
resend.from.email=${EMAIL_FROM:onboarding@resend.dev}

# Server (IMPORTANTE)
server.port=${PORT:8080}

# Database
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# Flask AI Microservice
flask.base-url=${FLASK_BASE_URL}

# Multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Backblaze B2
b2.authorize-url=${B2_AUTHORIZE_URL}
b2.key-id=${B2_KEY_ID}
b2.application-key=${B2_APPLICATION_KEY}
b2.bucket-id=${B2_BUCKET_ID}
b2.bucket-name=${B2_BUCKET_NAME}

server.forward-headers-strategy=framework
